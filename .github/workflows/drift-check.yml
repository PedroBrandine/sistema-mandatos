name: Detecção de deriva

# Compara o schema REAL de cada projeto com o que as migrations produzem.
#
# Por que existe: `supabase migration list` compara a tabela de histórico, não
# o schema. Ele é cego para SQL rodado à mão no SQL Editor -- e foi exatamente
# assim que quatro divergências entre dev e prod nasceram entre 30/07 e 06/08,
# uma delas derrubando a produção inteira (GRANT USAGE ausente, migration
# 0028). Só `db diff` pega esse tipo de coisa, e ele exige Docker, que a
# máquina de desenvolvimento não tem. Aqui tem.
#
# Roda semanalmente e sob demanda. Não bloqueia nada -- só avisa.

on:
  schedule:
    - cron: '17 11 * * 1'   # segundas, 11h17 UTC (~8h17 em Brasília)
  workflow_dispatch:

jobs:
  diff:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: dev
            ref: npnvoolkebhabjkjzqwn
            senha: SUPABASE_DB_PASSWORD_DEV
          - nome: prod
            ref: dgoutrbqfuyaroobhxdq
            senha: SUPABASE_DB_PASSWORD_PROD
    steps:
      - uses: actions/checkout@v4

      # Fixa pelo mesmo motivo do deploy-db.yml: este workflow também faz
      # `supabase link`, e a 2.112.0 quebrou essa chamada (ver comentário lá).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      # O host direto resolve só em IPv6 e o runner não tem IPv6; o caminho é o
      # pooler. Ver .github/scripts/url-pooler.sh. Exporta DB_URL.
      - name: Descobrir URL IPv4 do banco (pooler)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ matrix.ref }}
          SENHA: ${{ secrets[matrix.senha] }}
        run: bash .github/scripts/url-pooler.sh

      - name: Histórico de migrations
        run: supabase migration list --db-url "$DB_URL"

      # Falha se houver diferença entre o schema remoto e o que as migrations
      # descrevem. Uma falha aqui significa: alguém mexeu no banco por fora.
      #
      # O diff bruto traz ~170 statements que são baseline da nuvem Supabase e
      # não deriva de ninguém; filtra-deriva.sh explica cada categoria e o
      # resumo do que foi ignorado sai no log deste passo.
      - name: Diff de schema
        run: |
          set -o pipefail
          supabase db diff --db-url "$DB_URL" --schema public,app,tse,stg > diff-bruto.txt
          bash .github/scripts/filtra-deriva.sh < diff-bruto.txt > diff.txt
          # `-s` não serve: o filtro emite linhas em branco entre statements, e
          # um arquivo só de espaços passaria como "tem conteúdo".
          if grep -qE '[^[:space:]]' diff.txt; then
            echo "::error::Deriva detectada em ${{ matrix.nome }} — o banco não bate com as migrations."
            cat diff.txt
            exit 1
          fi
          echo "Sem deriva em ${{ matrix.nome }} além do baseline da plataforma."

      - name: Auditoria de segurança
        if: always()
        run: supabase db advisors --db-url "$DB_URL" --type all
