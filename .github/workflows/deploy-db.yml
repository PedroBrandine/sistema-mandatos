name: Deploy do banco (produção)

# Aplica migrations e configuração de auth no projeto de PRODUÇÃO ao mergear
# em master. É o único caminho automatizado até o banco de produção -- nada
# de SQL Editor.
#
# A Vercel já publica o código sozinha no push para master; este workflow
# cuida da parte que ela não cobre: o schema.

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch:        # permite rodar à mão pela aba Actions

concurrency:
  group: deploy-db-prod     # nunca dois deploys de banco ao mesmo tempo
  cancel-in-progress: false

env:
  PROJECT_REF_PROD: dgoutrbqfuyaroobhxdq
  SITE_URL_PROD: https://sistema-mandatos.vercel.app

jobs:
  deploy:
    name: Migrations + config no prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Linkar no projeto de produção
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: supabase link --project-ref "$PROJECT_REF_PROD"

      - name: Conferir o que será aplicado
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: supabase migration list --linked

      - name: Aplicar migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: supabase db push --linked

      # site_url é por ambiente (config.toml usa env(SUPABASE_AUTH_SITE_URL)).
      # Sem a variável, o push grava site_url vazio e os redirecionamentos de
      # auth quebram.
      - name: Aplicar configuração de auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          SUPABASE_AUTH_SITE_URL: ${{ env.SITE_URL_PROD }}
        run: supabase config push

      - name: Auditoria de segurança pós-deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: supabase db advisors --linked --type security --level error
